name: 每日科学简报

# 定时：每天 UTC 00:00（= 北京时间 08:00）跑一次。
# GitHub Actions 的 cron 用的是 UTC，改时间记得减 8 小时。
on:
  schedule:
    - cron: '0 0 * * *'
  # 手动触发按钮：Actions → 每日科学简报 → Run workflow
  workflow_dispatch:
    inputs:
      book:
        description: 只出某一本书（daily / science / materials / physics / popular / tech / current_cn / current_world / essays）；留空 = 按配方 CLOUD_BOOKS 全出
        required: false
        default: ''
  # 改了订阅源或脚本后自动重建一次，方便验证
  push:
    paths:
      - 'recipes/**'
      - 'scripts/**'
      - '.github/workflows/daily-brief.yml'

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    # ubuntu-latest 正在灰度迁移到 Ubuntu 26.04（2026-10-19 起，11-19 结束），
    # 同一个 workflow 可能落到不同镜像上，结果不可复现；这里钉死在 24.04。
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 计算当天日期（北京时间）
        id: date
        run: echo "tag=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: 安装中文字体和 Calibre
        run: |
          # 关键：GitHub 用 `bash -e {0}` 执行 run 块，任何一条命令返回非 0 都会
          # 立刻终止整个脚本 —— 那样后面的日志打印和 Summary 根本跑不到（前三次
          # 失败查不到原因就是这个）。所以这里先 set +e，自己收集退出码。
          set +e
          log=/tmp/install.log
          {
            . /etc/os-release
            echo "发行版：$PRETTY_NAME / $(uname -m)"
            echo "--- apt 依赖 ---"
            sudo apt-get update -o Acquire::Retries=3
            echo "[apt update 退出码 $?]"
            sudo apt-get install -y --no-install-recommends \
              ca-certificates wget xz-utils fonts-noto-cjk
            echo "[apt install 退出码 $?]"
            echo "--- 下载安装脚本 ---"
            sudo -v
            wget -nv -O /tmp/calibre-installer.sh https://download.calibre-ebook.com/linux-installer.sh
            echo "[wget 退出码 $?]"
            echo "脚本前 3 行："
            head -n 3 /tmp/calibre-installer.sh
            echo "--- 执行官方安装脚本 ---"
            sudo bash /tmp/calibre-installer.sh
            echo "[installer 退出码 $?]"
          } > "$log" 2>&1

          if ! command -v ebook-convert >/dev/null 2>&1; then
            { echo "--- 官方脚本没装上，改用 apt 的 calibre 兜底 ---"
              sudo apt-get install -y --no-install-recommends calibre
              echo "[apt calibre 退出码 $?]"; } >> "$log" 2>&1
          fi

          ok=1
          command -v ebook-convert >/dev/null 2>&1 || ok=0
          ebook-convert --version >/dev/null 2>&1 || ok=0
          status=成功
          [ "$ok" = 1 ] || status=失败

          # annotation 走公开接口，不登录也能读到；截断到 1800 字节防止被丢弃
          brief=$(tail -n 20 "$log" | tail -c 1800 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS=""} NR>1{printf "%%0A"} {print}')
          if [ "$ok" = 1 ]; then
            echo "::notice::Calibre 就绪：$(ebook-convert --version | head -n 1)"
          else
            echo "::error::安装失败，日志末尾：$brief"
          fi
          { echo "## 安装步骤输出：$status"; echo '```'; tail -n 80 "$log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "安装结果：$status"
          [ "$ok" = 1 ] || exit 1
          ebook-convert --version

      - name: 订阅源可达性自检
        run: |
          set -uo pipefail
          python3 scripts/check_feeds.py recipes/daily-science-brief.recipe | tee out-check.txt || true
          {
            echo "## 订阅源自检（runner 侧结果）"
            echo '```'
            cat out-check.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: 本期要出哪几本书
        id: books
        run: |
          set -uo pipefail
          # workflow_dispatch 里填了 book 就只出那一本；定时跑按配方里的 CLOUD_BOOKS 全出
          selected='${{ github.event.inputs.book }}'
          if [ -n "$selected" ]; then
            list="$selected"
            echo "手动指定：$list"
          else
            list=$(python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import recipe_config as rc
          print(' '.join(rc.load()['CLOUD_BOOKS']))
          PY
          )
            echo "按配方 CLOUD_BOOKS：$list"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: 逐本生成 EPUB
        id: build
        run: |
          set -uo pipefail
          mkdir -p out
          # 纯 RSS 配方不需要 X 显示服务，这里只是保险
          export QT_QPA_PLATFORM=offscreen
          tag='${{ steps.date.outputs.tag }}'
          : /tmp/books.txt
          for key in ${{ steps.books.outputs.list }}; do
            book="out/${key}-${tag}.epub"
            echo "================ 《$key》 ================"
            # 一本挂了不影响其它本：选材失败、转换失败都只记 warning 继续下一本
            if python3 scripts/build_brief.py --book "$key" --out "$book" \
               && [ -s "$book" ]; then
              mb=$(python3 -c "import os;print(round(os.path.getsize('$book')/1048576, 2))")
              printf '%s\t%s\n' "$key" "$mb" >> /tmp/books.txt
            else
              echo "::warning::$key 这本没生成，跳过（多半是这一类的源全挂了）"
            fi
          done
          if [ ! -s /tmp/books.txt ]; then
            echo "::error::所有书都没生成，看上面日志"
            exit 1
          fi
          ls -lh out/
          {
            echo "## 本期出书"
            echo '| 书 | 大小 MB |'
            echo '| --- | --- |'
            while IFS=$'\t' read -r key mb; do echo "| $key | $mb |"; done < /tmp/books.txt
          } >> "$GITHUB_STEP_SUMMARY"
          total=$(du -sm out/ | cut -f1)
          echo "total_mb=$total" >> "$GITHUB_OUTPUT"

      - name: 体积提醒
        run: |
          while IFS=$'\t' read -r key mb; do
            echo "$key: ${mb} MB"
            python3 - "$key" "$mb" <<'PY'
          import sys
          key, mb = sys.argv[1], float(sys.argv[2])
          if mb > 20:
              print(f'::warning::{key} 超过 20MB，邮箱和 Kindle 可能拒收；'
                    '把配方里对应大类的 QUOTA 或 compress_news_images_max_size 调小。')
          elif mb > 10:
              print(f'提示：{key} 已超过 10MB，若要发邮件建议先精简。')
          PY
          done < /tmp/books.txt

      - name: 上传为 Actions 产物（保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief-${{ steps.date.outputs.tag }}
          path: out/*.epub
          retention-days: 30
          if-no-files-found: error

      - name: 归档进仓库 briefs/ 目录
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p briefs
          cp out/*.epub briefs/
          # 每种书各留最近 14 期，别把别的类的书删掉
          for f in briefs/*.epub; do
            key=$(basename "$f"); key="${key%%-*}"
            ls -1t briefs/"${key}"-*.epub 2>/dev/null | tail -n +15 | xargs -r rm -f || true
          done
          git add -A briefs
          if git diff --cached --quiet; then
            echo "没有需要新增归档的内容"
          else
            git commit -m "chore(brief): ${{ steps.date.outputs.tag }} ${{ steps.books.outputs.list }}"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # 下面两步默认不执行：只在仓库里配好 SMTP Secrets 后自动启用
      - name: 检测是否配置了邮件推送
        id: mail
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
        run: |
          if [ -n "${SMTP_HOST:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "SMTP_HOST 未配置，跳过发邮件。本期已存入 briefs/ 和 Actions 产物。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 邮件推送（每本书一封）
        if: steps.mail.outputs.enabled == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          set -uo pipefail
          tag='${{ steps.date.outputs.tag }}'
          while IFS=$'\t' read -r key mb; do
            # 每本书一封邮件，主题带上书名，Kindle 那边也能分得清
            MAIL_SUBJECT="每日科学简报 $tag · $key" \
              python3 scripts/send_email.py "out/${key}-${tag}.epub" || echo "::warning::$key 发信失败"
          done < /tmp/books.txt
